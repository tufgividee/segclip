[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "segclip"
version = "0.1.0"
description = "Interactive clipboard text segmentation for AI conversations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
segclip = "segclip.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.hatch.build.targets.wheel]
packages = ["src/segclip"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
